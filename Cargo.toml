[workspace]
resolver = "2"
members = ["crates/core", "crates/agent"]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
thiserror = "1"
