name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: Parent web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parent-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parent-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Fail if a server secret key leaked into the bundle
        run: |
          # Match an actual secret-key value, not the role *name* "service_role"
          # (which legitimately appears inside the minified Supabase library).
          if grep -rqE 'sb_secret_[A-Za-z0-9_-]{10,}' dist; then
            echo "A server secret key appears in the built web bundle!"; exit 1
          fi
