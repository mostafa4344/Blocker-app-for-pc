name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}   # lets you run it manually from the GitHub website

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: child-app-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME set, licenses accepted). No setup-android action needed —
      # that action tried to install the obsolete "tools" package and failed.
      - name: Accept SDK licenses (best effort)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-debug-apk
          path: child-app-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
